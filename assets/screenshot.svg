  <rect x="392" y="80" width="122" height="22" rx="3" fill="#23232a" />
  <text x="402" y="95" class="mono base">mode:smart <tspan class="muted">^r</tspan></text>

  <line x1="1" y1="116" x2="839" y2="116" stroke="#2c2c34" stroke-width="1" />

