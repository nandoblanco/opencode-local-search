  <text x="44" y="64" class="mono base">playwright role:user date:7d</text>
  <rect x="272" y="50" width="9" height="18" fill="#ff9e64" />

  <!-- Filter Pills Bar -->
  <rect x="28" y="80" width="114" height="22" rx="3" fill="#23232a" />
  <text x="38" y="95" class="mono base">scope:all <tspan class="muted">^p</tspan></text>

  <rect x="152" y="80" width="116" height="22" rx="3" fill="#ff9e64" />
  <text x="162" y="95" class="mono bold dark">role:user ^g</text>

